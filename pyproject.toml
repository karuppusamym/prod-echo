[project]
name = "prod-echo"
version = "0.1.0"
description = "Rebuild the screens UiPath bots use, over a masked copy of their data, for agent testing."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
  "sqlalchemy>=2.0",
  "playwright>=1.44",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "flask>=3.0",
  "cryptography>=42",
]

[dependency-groups]
dev = ["pytest>=8", "ruff==0.12.11", "httpx>=0.27"]

[project.scripts]
echo = "echo.cli:main"
prod-echo = "echo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["echo*", "harness*"]

[tool.setuptools.package-data]
"*" = ["*.js", "*.css", "*.html", "*.svg", "*.txt", "*.json", "*.xaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["bundles", "runs", "work", "echo_db", "generated_apps"]

[tool.ruff.lint]
# The defaults plus isort and bugbear, spelled out so a newer ruff cannot widen the set.
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "browser: drives the harness in a real Chromium (slow)",
  "replica: needs the sample Postgres replica (scripts/sample_replica.py up)",
]
addopts = "-m 'not browser and not replica'"
